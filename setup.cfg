[nosetests]
verbosity=2
with-coverage=1
cover-package=service
cover-erase=1
 
[coverage:run]
source = service
 
[flake8]
max-line-length = 127
exclude = .git,__pycache__,.venv,venv,build,dist
 
[pylint]
max-line-length = 127
disable = missing-docstring,too-few-public-methods,import-outside-toplevel
